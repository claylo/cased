testing:
  runner: just
  command: just test
  sources:
    - Justfile
  notes: >
    `just test` runs `node --test` over an explicit file list in the Justfile.
    Also gates: `just check-contract` (schema stamp drift), `just check-bundle`
    (rolldown bundle drift), `just build-smoke`. Evals (`just eval …`) spend
    real tokens and are not part of `just test`. Never run bare `node --test`
    for the suite — the Justfile list is the canonical set (and is known to omit
    test/flow-to-svg.test.mjs).
boundaries:
  - name: shell_execution
    description: Bash scripts that spawn git, tokei, cargo, node, rsync, and
      headless LLM CLIs (claude -p, codex exec) with paths and prompts
      interpolated
    modules:
      - recon
      - evals
      - eval-fixtures
      - build-scripts
      - schemas
    notes: "Primary injection surface: fixture names, audit dir paths, model/effort
      flags flow into command lines; run-eval executes a model with acceptEdits
      permissions inside a workdir"
  - name: untrusted_yaml_ingest
    description: Model-authored findings.yaml / recon.yaml / actions-taken.md parsed
      and rendered into HTML, and used to drive git commands
    modules:
      - viewer
      - evals
    notes: Slugs, paths, evidence, and SHAs come from LLM output; rendered into
      report.html and passed to execFileSync git; XSS/escaping and
      path-traversal are the concerns
  - name: filesystem_writes
    description: build-report writes report.html/AGENTS.md/CLAUDE.md/README scaffold
      into the audit dir; build-viewer copies into skills/; setup.sh rm -rf .git
      and rewrites a workdir
    modules:
      - viewer
      - build-scripts
      - eval-fixtures
    notes: Destructive operations (rm -rf .git in setup.sh) gated by preflight;
      scaffold overwrite rules (README never overwritten; CLAUDE.md only if
      absent)
  - name: contract_stamping
    description: src/schemas is canonical; copies stamped into skills/*/references;
      bundle copied into skills/cased/scripts
    modules:
      - schemas
      - build-scripts
    notes: Drift is a correctness risk for every downstream audit; CI gates
      check-contract/check-bundle
  - name: skill_prose_contract
    description: SKILL.md, agent prompts, references, and templates form a
      behavioural contract that models follow; contradictions between prose and
      gates are defects
    modules:
      - skill-cased
      - skill-crustoleum
    notes: Docs win over code by project rule; gates in src/viewer must match what
      prose promises
