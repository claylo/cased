          real run the executed string is `recon.yaml#testing.command` read out of the
          audit directory inside the eval workdir. Two independent writers control that
          value. First, detectTesting priority 1 copies it verbatim from the target
          repo's scrat config (commands.test), so a repository under audit chooses the
