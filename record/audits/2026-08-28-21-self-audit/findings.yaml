      - slug: setup-trap-deletes-only-copy
        title: The fixture's EXIT trap deletes the only copy of the files it moved out of the workdir
        concern: advisory
        locations:
          - path: evals/fixtures/reaudit-rs/setup.sh
            start_line: 78
            end_line: 85
        evidence: |
          STASH="$(mktemp -d)"
          # The stash is the only copy of the final main.rs/config.rs and the unsubstituted
          # ledger while the rewind is in flight: if this script dies mid-run the workdir is
          # unrecoverable, so re-rsync a fresh one rather than re-running setup.sh over it.
          trap 'rm -rf "$STASH"' EXIT
          cp src/main.rs src/config.rs "$STASH/"
          mv "$LEDGER" "$STASH/actions-taken.md"
          mv "$AUDIT_DIR" "$STASH/audit-dir"
        evidence_lang: bash
        evidence_markers:
          - lines: "5"
            type: del
            label: fires on failure too, deleting the stash
          - lines: 7-8
            type: mark
            label: mv, not cp — the stash is the only copy
        mechanism: |
          Lines 84-85 move — not copy — the unsubstituted ledger and the entire prior-audit
          directory into $STASH, and the script has already run `rm -rf .git` at line 49. The
          EXIT trap fires on the failure path as readily as on success, so any abort between
          here and the restore at line 130 (a `cargo check` failure inside commit(), a drifted
          sed anchor tripping edit()'s no-op guard, a git failure) deletes the only copy of the
          moved artifacts. The comment acknowledges the workdir becomes unrecoverable, but the
          trap is what makes it unrecoverable: without it the operator could restore from
          $STASH. run-eval invokes this under `set -e` (evals/scripts/run-eval:92-94) and
          aborts, leaving a run directory whose workdir is a half-built fixture with no prior
          audit in it and no way to tell from the artifacts what went wrong.
        remediation: |
          Use `cp -a` instead of `mv` for the ledger and audit directory, or make the trap
          conditional: set a `SUCCESS=1` flag before the final consistency checks and have the
          trap run `[[ -n "${SUCCESS:-}" ]] && rm -rf "$STASH" || echo "setup.sh failed;
          originals preserved in $STASH" >&2`. Also add a trap or explicit cleanup for the
          per-edit temp file created at line 60, which leaks when sed fails under set -e.
