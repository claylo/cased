  - slug: supply-chain-surface
    title: The Supply Chain Surface
    thesis: "No runtime dependencies ship, so the supply-chain question is not vulnerability but attribution: the bundle carries ~80 MIT/ISC/BSD packages and none of their notices."
    verdict: One policy defect worth fixing before a public release — a generated THIRD-PARTY-NOTICES file — and one ergonomics gap in the eval runner. Nothing copyleft, nothing unpinned in CI.
    findings:
      - slug: bundled-third-party-source-missing-license-notices
        title: Shipped skill bundles strip MIT/ISC/BSD license notices from ~80 third-party packages
        concern: significant
        locations:
          - path: skills/cased/scripts/build-report.js
            start_line: 38
            end_line: 40
          - path: skills/cased/templates/viewer.js
            start_line: 1
            end_line: 3
        evidence: |
          //#region node_modules/yaml/dist/nodes/identity.js
          var require_identity = /* @__PURE__ */ __commonJSMin(((exports) => {
          	const ALIAS = Symbol.for("yaml.alias");
          (function() {
          	//#region node_modules/rough-notation/lib/rough-notation.esm.js
          	const t = "http://www.w3.org/2000/svg";
        evidence_lang: js
        evidence_markers:
          - lines: "1"
            type: mark
            label: rolldown region marker names the bundled package, but no license/copyright text accompanies it
          - lines: "5"
            type: mark
            label: same in the viewer bundle
        mechanism: |
          `scripts/build-viewer.sh` runs `npx rolldown ... --format cjs` and
          `--format iife` to produce the two artifacts the skill actually ships:
          `skills/cased/scripts/build-report.js` (40,964 lines) and
          `skills/cased/templates/viewer.js` (823 lines). Both are committed
          output, redistributed to every user who installs the cased skill.
          grep across the full build-report.js bundle shows 333 distinct
          `//#region node_modules/<pkg>/...` inlining markers (yaml, ajv,
          ajv-formats, @shikijs/*, @expressive-code/*, postcss,
          postcss-selector-parser, hast-util-to-html, hastscript,
          property-information, oniguruma-to-es, source-map-js, nanoid,
          cssesc, and more — 81 unique packages resolved in node_modules
          total). Surveying every package.json under node_modules gives 74 MIT, 4
          ISC and 3 BSD — fast-uri and source-map-js (BSD-3-Clause, and
          source-map-js is inlined with 11 region markers) and nth-check
          (BSD-2-Clause). None are copyleft, so license *compatibility* is not at
          issue, but MIT, ISC and both BSD variants all require the
          license/copyright notice to be preserved in redistributed copies, and
          BSD-3 adds a non-endorsement clause. Searching the two shipped bundles for
          "Permission is hereby granted" (the MIT text) or "Copyright (c)"
          notices returns zero matches in either file; the only surviving
          attribution comment in the entire 40,964-line build-report.js is
          an unrelated single-line `/*! https://mths.be/cssesc v3.0.0 by
          @mathias */` banner that happened to match rolldown's default
          "preserve legal comments" heuristic. No NOTICE, THIRD-PARTY-LICENSES,
          or equivalent file exists anywhere in the repo (checked repo root
          and `skills/cased/`), and neither README.md nor AGENTS.md mentions
          bundled third-party attribution. The bundling step has shipped this
          way since the artifact was first generated (commit b565da4,
          2026-04-05) and survived the Aug 10 dependency-refresh commit (#36)
          that bumped rolldown, shikijs, and expressive-code versions without
          addressing attribution.
        remediation: |
          Generate a THIRD-PARTY-NOTICES file as part of `scripts/build-viewer.sh`
          (e.g. via `license-checker` or `npx rolldown`'s own legal-comments
          output mode set to a separate file) and ship it alongside
          `skills/cased/scripts/build-report.js` and
          `skills/cased/templates/viewer.js`. Reference it from
          `skills/cased/SKILL.md` or the repo README so installers can see
          what's bundled. This is mechanical — a build-step addition, not a
          design change.
