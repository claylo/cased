          compounds it — a caller sees `recon: Cannot read properties of undefined (reading
          'slice')` and exit 3, with no stack, no file name, and a documented meaning that
          points them at their PATH. The one code the taxonomy reserves for the script's real
          job, exit 4 (validation failure), is only reachable on the narrow path where ajv
          reports errors; a crash while building the object it would have validated is
          indistinguishable from tokei not being installed.
        remediation: |
          Give the catch distinct exits: keep 3 for genuinely missing/failed tooling inputs
          (ENOENT on the temp-dir files), add a code for "internal error while assembling
          recon.yaml", and print `err.stack` (or err.message plus the operation being attempted)
          so the failing step is identifiable. Update the exit-code block in src/recon/recon to
          match, since the documentation is the contract other callers read.
