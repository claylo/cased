            start_line: 929
            end_line: 935
          - path: src/viewer/viewer.js
            start_line: 7
            end_line: 8
        evidence: |2
            const html = template
              .replace('<!-- SLOT:title -->', escHtml(title))
              .replace('<!-- SLOT:fonts -->', fontFaceDecls)
              .replace('<!-- SLOT:style -->', allCss)
              .replace('<!-- SLOT:content -->', contentHtml)
              .replace('<!-- SLOT:data -->', JSON.stringify(dataBlob))
              .replace('<!-- SLOT:viewer -->', allJs);
            const dataEl = document.getElementById('cased-data');
            const data = dataEl ? JSON.parse(dataEl.textContent) : {};
        evidence_lang: javascript
        evidence_markers:
          - lines: "6"
            type: del
            label: JSON.stringify does not escape < or /, so a literal </script> in the data ends the element
          - lines: "9"
            type: mark
            label: unguarded parse of the truncated blob; the value is never read
        mechanism: |
          `assembleReport` builds `dataBlob = { recon, findings }` from the two audit
          YAML files and drops `JSON.stringify(dataBlob)` verbatim into
          `<script id="cased-data" type="application/json">` in template.html.
          JSON.stringify escapes quotes and backslashes but never `<` or `/`, and the
          HTML parser terminates a script element at the first literal `</script`
          regardless of JSON context. Every string in that blob is model-authored or
          copied out of the audited repo: evidence blocks are required by the fidelity
          gate to be verbatim source lines, so auditing any repo containing the byte
          sequence `</script>` — an HTML template, a JS bundle, a doc example, cased's
          own src/viewer/template.html — ends the data element early, and everything
          after it is reparsed as markup. An audited file containing
          `</script><img src=x onerror=...>` therefore executes in the reader's browser
          when the report is opened or forwarded. Even with no payload the breakage is
          certain: the truncated JSON makes JSON.parse at viewer.js:8 throw inside the
          DOMContentLoaded handler before initAnnotations, initSlides and initNavBar
          run, so the report silently loses every interactive feature — and the parse
          buys nothing, because `data` is assigned and never read anywhere in the
          module. Nothing on this path validates or escapes: `build` never invokes the
          schema validator (that is the separate `validate` subcommand), and escHtml is
          applied to the title slot but not the data slot.
        remediation: |
          Escape the JSON before interpolation: replace `<`, `>`, `&` and U+2028/U+2029
          with their \uXXXX forms, which stay valid JSON and are inert to the HTML
          parser — JSON.stringify(dataBlob).replace(/[<>&  ]/g, c =>
          '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0')). Add a build-time
          assertion that the assembled HTML contains no stray `</script` inside a slot.
          In viewer.js either delete the dead parse or wrap it in try/catch so a
          malformed blob degrades to a static report instead of killing every
          initializer.
