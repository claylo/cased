  - slug: completeness-surface
    title: The Completeness Surface
    thesis: "The prose promises more than the gates deliver: two CI jobs abort before checking anything, a third of the test suite never runs, and several documents describe a repository that no longer exists."
    verdict: The two significant findings are the ones that matter for launch credibility — a project whose pitch is mechanical gates ships with its bundle-drift gate dead in CI and 31 tests unreachable. Both are one-line fixes. The documentation drift (README keys, AGENTS.md paths, crustoleum counts, a Codex thread cap that is one short) is the ordinary residue of a fast August and should be swept before the release post.
    flow:
      - id: push
        label: push / PR
        type: start
      - id: test
        label: just test
        type: process
        findings:
          - slug: flow-diagram-tests-excluded-from-suite
            label: 31 tests unlisted
      - id: ys
        label: ys installed?
        type: decision
        no: abort
      - id: bundle
        label: check-bundle + build-smoke
        type: process
      - id: green
        label: CI green
        type: end
      - id: abort
        label: build-schemas.sh exit 1
        type: process
        spine: false
        findings:
          - slug: ci-drift-gates-abort-without-ys
            label: gate never runs
    findings:
      - slug: ci-drift-gates-abort-without-ys
        title: CI's bundle and smoke gates abort before they check anything
        concern: significant
        locations:
          - path: .github/workflows/ci.yaml
            start_line: 25
            end_line: 31
          - path: src/schemas/build-schemas.sh
            start_line: 29
            end_line: 35
        evidence: |2
                - uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2.85.1
                  with:
                    tool: just
                - run: npm ci
                - run: just test
                - run: just check-bundle
                - run: just build-smoke
          for bin in jq ys; do
            if ! command -v "$bin" >/dev/null 2>&1; then
              echo "error: required tool '$bin' not found in PATH" >&2
              [[ "$bin" == "ys" ]] && echo "  install: cargo install yaml-schema --locked" >&2
              exit 1
            fi
          done
        evidence_lang: yaml
        evidence_markers:
          - lines: "3"
            type: mark
            label: test job installs just only
          - lines: 6-7
            type: del
            label: both recipes shell into build-schemas.sh
          - lines: "12"
            type: del
            label: hard exit when ys is absent
        mechanism: |
          AGENTS.md states as an iron rule that "CI fails on drift (check-contract,
          check-bundle)". check-bundle and build-smoke both run scripts/build-viewer.sh,
          whose first action is `bash src/schemas/build-schemas.sh`; that script hard-requires
          both jq and ys (yaml-schema, a Rust crate) and exits 1 when either is missing.
          The CI `test` job installs only `just` via install-action and never installs
          yaml-schema — only the separate `contract` job does (tool: just,yaml-schema),
          and that job runs check-contract, not check-bundle or build-smoke. So both of the
          shipped-artifact gates abort with "required tool 'ys' not found in PATH" before
          rolldown ever runs, and the drift check AGENTS.md promises never executes. The
          maintainer does not see this locally because ys is installed at
          /Users/clay/.cargo/bin/ys. Neither README.md nor AGENTS.md lists ys as a
          prerequisite for check-bundle/build-smoke — AGENTS.md annotates only
          check-contract with "(needs ys: cargo install yaml-schema)".
        remediation: |
          Add yaml-schema to the `test` job's install-action tool list
          (tool: just,yaml-schema), or split the schema-doc regeneration out of
          scripts/build-viewer.sh so bundling does not depend on ys. Then annotate
          check-bundle and build-smoke in AGENTS.md's Commands block with the same
          "(needs ys)" note check-contract already carries.
