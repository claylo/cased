      - slug: recon-exec-skips-tmp-cleanup
        title: recon's exec hand-off discards the EXIT trap, leaking its temp directory on every successful run
        concern: advisory
        locations:
          - path: src/recon/recon
            start_line: 56
            end_line: 57
          - path: src/recon/recon
            start_line: 164
            end_line: 165
        evidence: |
          TMP="$(mktemp -d -t cased-recon.XXXXXXXX)"
          trap 'rm -rf "$TMP"' EXIT
          echo "recon: building recon.yaml"
          exec node "$SCRIPT_DIR/recon-to-yaml.mjs" "$TMP" "$AUDIT_DIR/recon.yaml"
        evidence_lang: bash
        evidence_markers:
          - lines: "2"
            type: mark
            label: the trap
          - lines: "4"
            type: del
            label: exec replaces the process; the trap never fires
        mechanism: |
          `exec` replaces the shell process image, so the EXIT trap registered at line 57 never
          fires. Every run that reaches line 165 — which is every successful run, and every run
          that fails inside recon-to-yaml.mjs — leaves its mktemp directory behind holding the
          full cargo metadata, tokei output, and twelve months of git log for the audited
          project. Only the early-exit paths (exit 1/2/3 above line 165) actually clean up, so
          the trap protects the cheap cases and abandons the expensive one. On a machine where
          /tmp is not swept, repeated audits accumulate copies of source-tree metadata for
          every project audited.
        remediation: |
          Drop the `exec` and run the node script normally so the trap fires: `node
          "$SCRIPT_DIR/recon-to-yaml.mjs" "$TMP" "$AUDIT_DIR/recon.yaml"` as the last command,
          letting the script's exit status propagate under `set -e` — or keep exec and delete
          $TMP explicitly before it, passing the assembled inputs by another route.
