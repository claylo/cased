            label: "recon's sibling pattern: check-then-fail-with-install-hint before any tool is invoked"
        mechanism: |
          `src/recon/recon` establishes the project's own convention for
          handling external CLI dependencies: before doing anything, it loops
          over `cargo git tokei node`, checks each with `command -v`, and on a
          miss prints an install hint and exits with a dedicated code (3),
          documented in the script's header comment. `evals/scripts/run-eval`
          depends on strictly more external tools — `rsync` (line 77-78, to
          stage the fixture workdir), `git` (lines 81-83), `claude` or `codex`
          (lines 142/157, the actual CLI under test), and `cargo test` (line
          243, hidden-tests scoring in remediate mode) — but performs zero
          existence checks on any of them. The script only sets
          `set -euo pipefail`; if `rsync`, `claude`, `codex`, or `cargo` is
          missing from PATH, execution fails with bash's bare "command not
          found" (exit 127) and no guidance, at whatever point in the
          multi-minute run the missing tool is first invoked — potentially
          after `rsync` has already staged a workdir and `git init` has already
          run. This is the same class of external-tool dependency the project
          has already solved once in the same repo; run-eval just doesn't
          apply the pattern.
        remediation: |
          Add a preflight loop to `evals/scripts/run-eval` mirroring
          `src/recon/recon` lines 37-46: check `rsync`, `git`, `cargo`, and the
          tool named by `--platform` (`claude` or `codex`) with `command -v`
          before the rsync stage begins, with an install hint per tool and a
          dedicated non-127 exit code.
