  - slug: api-design-surface
    title: The API Design Surface
    thesis: The contract is coherent where the schema enforces it and drifts where it does not — open objects, write-only fields, author-supplied counts, and a ledger parser that accepts a field it cannot read.
    verdict: "Nothing is broken today because every producer is the same author's model prompts, but the contract is the product: a third party writing findings.yaml or actions-taken.md gets no error for `criterion`, for a miscounted `summary`, or for an `Addresses` line without link syntax. Tightening the schema and cross-checking counts at build time closes most of it."
    flow:
      - id: src
        label: src/schemas/*.json
        type: start
      - id: stamp
        label: build-schemas.sh stamps
        type: process
      - id: agent
        label: subagent emits finding
        type: process
        findings:
          - slug: contract-fields-absent-from-schema
            label: criterion/surface
      - id: validate
        label: ajv validate
        type: process
        findings:
          - slug: findings-schema-accepts-unknown-keys
            label: open objects
