      - slug: template-slot-replace-interprets-dollar-patterns
        title: "Every template slot is filled with String.replace, so a `$'` or `` $` `` anywhere in the audit data splices the document into itself"
        concern: significant
        locations:
          - path: src/viewer/build-report.mjs
            start_line: 929
            end_line: 935
        evidence: |2
            const html = template
              .replace('<!-- SLOT:title -->', escHtml(title))
              .replace('<!-- SLOT:fonts -->', fontFaceDecls)
              .replace('<!-- SLOT:style -->', allCss)
              .replace('<!-- SLOT:content -->', contentHtml)
              .replace('<!-- SLOT:data -->', JSON.stringify(dataBlob))
              .replace('<!-- SLOT:viewer -->', allJs);
        evidence_lang: javascript
        evidence_markers:
          - lines: "2-7"
            type: del
            label: "string-form replace: the replacement is parsed for $&, $`, $', $$, $n — never literal"
        mechanism: |
          `String.prototype.replace(pattern, replacementString)` does not insert the
          replacement literally: it interprets `$&` (the match), `` $` `` (everything
          before the match), `$'` (everything after the match), `$$` and `$<n>`. All six
          slots here are filled that way, and the two that carry model-authored data are
          the ones that matter. `contentHtml` is rendered evidence and prose;
          `JSON.stringify(dataBlob)` is the entire findings document. Any finding whose
          evidence or prose contains a dollar sign followed by a backtick or an
          apostrophe — a shell regex anchor like `[^/]+\.svg)$'`, a JSON-Schema pattern
          like `` `^[A-Z]+-[0-9]+$` `` — is enough. This audit is the proof: its own
          findings.yaml contained both sequences before this finding existed (in the
          `hygiene-gate-swallows-git-failure` evidence and the
          `contract-fields-absent-from-schema` remediation), and the first report.html
          built from it had two `<!DOCTYPE>`s, four `</html>`s, four
          `<script id="cased-data">` blocks still holding the literal `<!-- SLOT:data -->`,
          six orphaned `<!-- SLOT:viewer -->` markers, and weighed 1.3 MB where the
          template is 759 bytes plus content. Writing this finding added more such sequences to the
          data; the rebuild has 30 DOCTYPEs, 101 `</html>`s and 9.4 MB, because every
          splice re-inserts a document that already contains the trigger. Nothing in `build`, `validate`, or `finalize` inspects the
          assembled HTML, so the corrupted deliverable ships silently. This is the sibling
          of `report-data-blob-script-breakout` one layer earlier in the same statement:
          that finding is about the HTML parser reading the JSON; this one is about the
          JavaScript runtime rewriting the document before the parser ever sees it.
          Reachability is total — the trigger is a dollar sign in audited source, which is
          ordinary in shell, Perl, PHP, Makefiles, regexes and template languages.
        remediation: |
          Never pass model-authored text as a string replacement. Use the function form,
          which inserts literally: `.replace('<!-- SLOT:data -->', () => json)` — for all
          six slots, since `allCss`/`allJs` are safe today only by accident. Then add the
          assertion that belongs in `build`: after assembly, the HTML must contain exactly
          one `<!DOCTYPE`, no remaining `<!-- SLOT:` marker, and the `cased-data` element
          must `JSON.parse`; fail the build otherwise. Add a unit test that assembles a
          findings document containing `$'`, `` $` `` and `$&` and asserts byte-for-byte
          that they survive. This audit's own `record/audits/2026-08-28-21-self-audit/`
          is the regression fixture. The fix is not done until the bundle is rebuilt
          (`scripts/build-viewer.sh`, then `just check-bundle`): the shipped
          `skills/cased/scripts/build-report.js:40775` carries the identical chain and is
          the code path every skill user actually executes — patching only the `.mjs`
          source fixes nothing for them.
        temporal:
          introduced: "2026-04-05"
          last_modified: "2026-08-28"
