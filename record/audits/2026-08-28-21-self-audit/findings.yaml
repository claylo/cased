audit_date: 2026-08-28
scope: Full-repo self-audit of cased at 2365a3f — src/ (viewer, recon, schemas), evals/ (runner, scorer, fixtures), skills/ (cased + crustoleum), scripts/, test/
commit: 2365a3f79e49d64a8b47d0de4445a80d206a04b0
assessment: |
  cased is a five-month-old, single-author skill whose product is a contract that
  language models follow, and this self-audit at 2365a3f reads its 42 findings as a
  pre-publish checklist rather than an incident list. There are no critical findings
  and three blocking ones, all the same shape: model-authored text reaches an
  interpreter unescaped. The worst was found by the audit breaking itself: every
  template slot is filled with string-form String.replace, so a "$'" in one evidence
  block and a "$`" in one remediation spliced the assembled HTML into itself, and the
  report.html in this directory has two DOCTYPEs and four closing html tags — no agent
  caught it and no gate checks the assembled document. Beside it, the renderer drops
  findings JSON into a <script> element raw, so any audited repository containing the
  bytes "</script>" — including this one — breaks the interactive report and can execute
  in the reader's browser; and the eval scorer runs recon.yaml's testing.command through
  /bin/sh on the operator's machine after the session that could have written it has
  ended. The other four significant findings are credibility problems for a project that sells
  mechanical gates: the CI jobs that check bundle drift have aborted before running
  on every push for 18 days, 29
  flow-diagram tests are unreachable from `just test`, nine bare catch blocks turn
  failures into defaults (one of which blesses an audit whose predecessor's findings
  were never dispositioned), and the shipped bundle strips ~80 packages' license
  notices. Everything else is the ordinary residue of a fast August — doc drift,
  duplicated helpers, untested gate branches, open schema objects — and belongs in the
  backlog, not the release. Six agents, 45 raw findings, four cross-surface duplicates
  collapsed. Reviewer: 41 reviewed, 35 confirmed, 6 adjusted, 0 disputed, 0 severity
  overrides, mechanism traced end-to-end on all 41; the adjustments widened two class
  sweeps (five unescaped sinks, not three; nine bare catches, not four) and corrected
  three counts and one license inventory. The 42nd finding was filed by the controller
  after assembly, when the built report turned out to be corrupt, and was sent back to
  the reviewer on its own.
narratives:
  - slug: security-surface
    title: The Security Surface
    thesis: cased has no network surface and no secrets, so its security posture is the trust it places in model-authored YAML on its way into HTML and into shells — and that trust is nearly total.
    verdict: "The report renderer is the real attack surface, and this audit broke it on the way out: every template slot is filled with string-form String.replace, so a `$'` in audited source spliced this report into itself, and one unescaped JSON slot lets any repository containing `</script>` break or script the reader's browser. Three smaller escaping gaps sit beside them. The eval harness runs models with full Bash by design — a documented choice, not a bug — but the scorer executing a model-authored test command through a shell is not. All are small fixes at known interpolation sites, and the first one is the reason report.html in this directory is unreadable."
