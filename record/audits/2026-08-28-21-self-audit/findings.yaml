            start_line: 60
            end_line: 62
        evidence: |
          function fileLines(repoRoot, p) {
            const abs = isAbsolute(p) ? p : join(repoRoot, p);
            if (!existsSync(abs)) return null;
            const txt = readFileSync(abs, 'utf8');
            return txt.split('\n');
          }
                              "required": ["path", "start_line", "end_line"],
                              "properties": {
                                "path": { "type": "string" },
        evidence_lang: javascript
        evidence_markers:
          - lines: "2"
            type: del
            label: absolute paths are honoured and join() does not reject ../ escapes
          - lines: "9"
            type: mark
            label: no pattern or relative-path constraint on the schema side
        mechanism: |
          checkEvidenceFidelity exists to bind a finding's evidence to the audited
          source tree, and it is the one gate that reads files named by model-authored
          YAML: locations[].path. fileLines treats an absolute path as authoritative and
          resolves everything else with join(), which happily normalises
          `../../../../etc/passwd`; findings.schema.json puts no pattern or
          relative-path constraint on `path`, so such a location validates cleanly. The
          gate then reads the file and, on mismatch, prints the source line back to the
          operator — build-report.mjs:1000 emits `file: <JSON-quoted file content>` for
          both `evidence` and `finalize`, and scoreArtifacts surfaces the same problems.
          An analysis subagent is driven by the contents of the repository under audit,
          which is untrusted input; a finding citing
          `/Users/<user>/.aws/credentials:3-3` turns the fidelity gate into a
          one-line-at-a-time reader for any file the operator can read, and the same
          path cited with matching evidence gets that content rendered into report.html
          as a gate-verified evidence block. This gate is the wrong place to trust the
          model — every other check in gates.mjs exists specifically to stop trusting
          it.
        remediation: |
          Resolve the candidate with resolve(repoRoot, p) and reject anything that does
          not start with resolve(repoRoot) + sep, pushing a `path-escapes-repo` problem
          instead of reading the file — the problem list already has the right shape.
          Reject absolute path values outright, and add a relative-path pattern to
          locations.items.path in src/schemas/findings.schema.json so the rule is
          enforced at validate time too, then re-stamp the contract into every
          consumer's references/ with build-schemas.sh.
