        mechanism: |
          Every analysis rubric (all seven of `skills/cased/agents/{api-design,code-quality,completeness,dependencies,error-handling,performance,security}.md`, grepped for `findings[].criterion`) and the shared output contract instruct subagents to emit `criterion` and `surface` on every finding, and the contract states that `surface` "maps to the narrative title". Neither field exists in `findings.schema.json` — not in `required`, not in `properties` — and neither appears in `findings.example.yaml`, `findings-schema.yaml.md`, or `SKILL.md` (grepped: zero hits outside the rubrics and the contract). They survive `build-report.js validate` only because the finding-level object has no `additionalProperties` bound, and nothing in `build-report.mjs` reads them, so the promised surface-to-narrative mapping is never checked and the criterion tag never reaches the report. Two of the contract's own fields are write-only. This audit is a live example: every agent emitted both fields and the controller stripped them during assembly because the schema has nowhere to keep them.
