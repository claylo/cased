testing:
  runner: just
  command: just test
  sources:
    - Justfile
  notes: >
    `just test` runs `node --test "test/*.test.mjs"` (glob since 67c42c8; 174
    tests at 9f7e30a). Other gates: `just check-contract` (schema stamp drift,
    now validates examples with ajv via src/schemas/validate-examples.mjs),
    `just check-bundle` (rolldown bundle drift), `just build-smoke`. Evals
    (`just eval …`) spend real tokens and are not part of `just test`. Any tool
    the Justfile wraps must be invoked through its recipe.
boundaries:
  - name: shell_execution
    description: Bash scripts that spawn git, tokei, cargo, node, rsync, and
      headless LLM CLIs (claude -p, codex exec) with paths and prompts
      interpolated
    modules:
      - recon
      - evals
      - eval-fixtures
      - build-scripts
      - schemas
    notes: "Since the prior audit: run-eval sandboxes the session by default
      (Claude native sandbox via --settings, allowUnsandboxedCommands=false)
      and allowlists Bash by command prefix; the scorer executes only
      operator-authored gate commands in argv form. Fixture names, audit dir
      paths, model/effort flags still flow into command lines."
  - name: untrusted_yaml_ingest
    description: Model-authored findings.yaml / recon.yaml / actions-taken.md
      parsed and rendered into HTML, and used to drive git commands
    modules:
      - viewer
      - evals
    notes: "Since the prior audit: slots filled by function-form replace; the
      data blob is \\uXXXX-escaped; header/glossary/ledger/flow sinks escaped;
      links scheme-allowlisted; build validates before rendering; counts derived;
      evidence gate reads git show <findings.commit> and refuses paths outside
      the repo. Remaining sinks and the schema's openness to unknown keys are
      the things to re-check."
  - name: filesystem_writes
    description: build-report writes report.html/AGENTS.md/CLAUDE.md/README
      scaffold into the audit dir; build-viewer copies into skills/; setup.sh
      rm -rf .git and rewrites a workdir; run-eval writes .cargo/audit.toml into
      the eval workdir under sandbox isolation
    modules:
      - viewer
      - build-scripts
      - eval-fixtures
      - evals
    notes: Destructive operations (rm -rf .git in setup.sh) gated by preflight;
      scaffold overwrite rules (README never overwritten; CLAUDE.md only if
      absent)
  - name: contract_stamping
    description: src/schemas is canonical; copies stamped into skills/*/references;
      bundle copied into skills/cased/scripts; validation of the examples now
      runs through the same ajv the bundle ships
    modules:
      - schemas
      - build-scripts
    notes: Drift is a correctness risk for every downstream audit; CI gates
      check-contract/check-bundle (both green since 67c42c8)
  - name: skill_prose_contract
    description: SKILL.md, agent prompts, references, and templates form a
      behavioural contract that models follow; contradictions between prose and
      gates are defects
    modules:
      - skill-cased
      - skill-crustoleum
    notes: Docs win over code by project rule; gates in src/viewer must match
      what prose promises. SKILL.md 3a′ now describes the git-show evidence
      gate; findings.md.footer says do not author summary.counts.
