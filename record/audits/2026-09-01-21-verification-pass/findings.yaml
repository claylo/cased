            end_line: 46
        evidence: |2
          rsync -a --exclude expected-findings.yaml --exclude target \
            --exclude setup.sh --exclude hidden-tests "$FIXTURE_DIR/" "$WORKDIR/"
          if [[ "$ISOLATION" == "sandbox" && -f "$WORKDIR/Cargo.lock" ]]; then
            if command -v cargo-audit >/dev/null 2>&1; then
              (cd "$RUN_DIR" && cargo audit -q -f "$WORKDIR/Cargo.lock" >/dev/null 2>&1) \
                || echo "warn: advisory-db refresh failed; the session's cargo audit will run stale" >&2
            fi
              CMD=(claude -p "$PROMPT" --output-format text --permission-mode acceptEdits --allowedTools "$ALLOWED_TOOLS")
          # Required tools
          for bin in cargo git tokei node; do
            if ! command -v "$bin" >/dev/null 2>&1; then
              echo "error: required tool '$bin' not found in PATH" >&2
              case "$bin" in
                cargo) echo "  install via https://rustup.rs" >&2 ;;
                tokei) echo "  install via 'cargo install tokei'" >&2 ;;
              esac
              exit 3
            fi
          done
        evidence_lang: bash
        evidence_markers:
          - lines: "1-2"
            type: mark
            label: "first external CLI invoked; no existence check precedes it"
          - lines: "4"
            type: mark
            label: "the only command -v in the script, added by c8eff06/7b3e626, guards an optional refresh — not a required tool"
          - lines: "8"
            type: mark
            label: "the CLI under test is invoked unchecked; a missing binary fails here with exit 127 after the workdir is staged"
          - lines: "9-19"
            type: ins
            label: "recon's sibling pattern: check-then-fail-with-install-hint before any tool is invoked"
        mechanism: |
          Still open, re-derived unchanged from the prior audit; the isolation
          changes in c8eff06 and 7b3e626 did not address it. src/recon/recon
          establishes the project's convention for external CLI dependencies:
          loop over the required binaries with `command -v` before doing any
          work, print an install hint, exit with a dedicated documented code (3).
          evals/scripts/run-eval depends on strictly more external tools — rsync
          (line 104, stages the workdir), git (line 128 onward), claude or codex
          (lines 216 and 232, the CLI under test), node (line 335 and the
          scorer), and cargo (line 327, hidden tests in remediate mode) — and
