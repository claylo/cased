      - slug: build-report-subcommand-fallback
        title: "An unrecognised build-report subcommand becomes the audit directory, and the exit-code contract is ad hoc"
        concern: moderate
        locations:
          - path: src/viewer/build-report.mjs
            start_line: 1044
            end_line: 1056
          - path: src/viewer/build-report.mjs
            start_line: 1109
