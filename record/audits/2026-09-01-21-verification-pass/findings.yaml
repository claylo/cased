          - lines: "14"
            type: del
            label: "carried_forward reason prose"
          - lines: "17"
            type: del
            label: "same chain in the README scaffold"
        mechanism: |
          The f4812fe fix for template-slot-replace-interprets-dollar-patterns replaced the
          HTML assembly chain with fillSlots (function-form, single pass) but left the two
          sibling chains that render AGENTS.md and the README scaffold. String.prototype.replaceAll
          with a string pattern applies the same GetSubstitution rules as replace: a replacement
          containing $', $`, $& or $$ splices the template text around the marker into the output,
          and because the thirteen replaces run sequentially, a value filled early that happens to
          contain a later {{marker}} is expanded as if it were template. Every value in the chain
          except the counts is text an agent wrote after reading an untrusted repository
          (findings.scope, narrative titles, locations[].path — the schema path pattern admits $ —,
          carried_forward[].reason) or text lifted verbatim from that repository
          (recon.testing.command comes from .config/scrat.yaml commands.test via detectScratTest).
          AGENTS.md is regenerated on every build and is the briefing the next Claude Code session
          auto-loads through CLAUDE.md, so a corrupted briefing persists across rebuilds. The sweep
          for .replace( and .replaceAll( with a non-function second argument in src/, evals/scripts/
          and scripts/ found these two chains to be the only remaining sites that take model- or
          repo-authored replacement values (the others substitute constants or escape sequences).
        remediation: |
          Route both renderers through the same mechanism as the HTML path: generalise fillSlots
          to take the marker regex (/\{\{(\w+)\}\}/g) or add a fillMarkdownSlots that does one
          pass over the template with a function-form callback, and have renderAgentsMd and
          renderReadmeMd build a slots object and call it. Keep the unknown-marker and
          missing-marker throws so a template edit cannot silently drop a slot. Add one test per
          renderer that puts $' and a {{finding_list}} literal into findings.scope and asserts
          the output contains them verbatim and nothing else changed.
