  - slug: api-design-surface
    title: The API Design Surface
    thesis: "Every new contract the batch introduced — the commit-read evidence gate, the path rule, the isolation flag, the link allowlist — has a seam where the promise and the implementation disagree, and the seven prior contract findings are untouched."
    verdict: "Four caused-by-fix findings, all moderate or below, all of the shape 'the fix is right, the contract around it is not stated': the isolation flag is not in run provenance, its allowlist claim is false on codex, the path rule lives in two implementations that accept different inputs, and safeHref drops links silently. Of the seven prior findings, two narrowed (build now validates; counts is one closed object of eleven). Nothing here is behaviourally dangerous; all of it is what you would want settled before a third party reads the contract."
    flow:
      - id: schema
        label: findings.schema.json
        type: start
        findings:
          - slug: findings-schema-accepts-unknown-keys
            label: 10 of 14 open
          - slug: contract-fields-absent-from-schema
            label: criterion/surface undeclared
          - slug: evidence-path-rule-implemented-twice
            label: two path rules
      - id: cli
        label: build-report CLI
        type: process
        findings:
          - slug: build-report-subcommand-fallback
            label: typo → directory
          - slug: shipped-help-names-source-paths
            label: help names src/
