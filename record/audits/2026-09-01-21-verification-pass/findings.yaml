      - slug: eval-isolation-allowlist-claim-false-on-codex
        title: "The --isolation contract promises the ALLOWED_TOOLS prefix allowlist on every platform; the codex branch applies none"
        concern: moderate
        locations:
          - path: evals/scripts/run-eval
            start_line: 28
            end_line: 38
          - path: evals/scripts/run-eval
            start_line: 232
            end_line: 242
          - path: evals/README.md
            start_line: 116
            end_line: 119
        evidence: |2
          #   --isolation sandbox  (default) the harness's own OS sandbox: on the
          #                        claude platform, seatbelt (macOS) / bubblewrap
          #                        (Linux) confines writes to the workspace and the
          #                        scratch dirs listed in SANDBOX_SETTINGS; codex runs
          #                        under `-s workspace-write`. Tool calls are still
          #                        limited to ALLOWED_TOOLS.
          #   --isolation none     no OS confinement; the session runs with the
          #                        operator's full user rights, gated only by the
          #                        ALLOWED_TOOLS command-prefix allowlist. Use it when
          #                        a fixture needs something the sandbox refuses, and
          #                        say so in the run notes.
              CMD=(codex exec --skip-git-repo-check
                   --ephemeral --ignore-user-config
                   --enable multi_agent)
              if [[ "$ISOLATION" == "sandbox" ]]; then
                CMD+=(-s workspace-write -c 'sandbox_workspace_write.network_access=true')
              else
                CMD+=(-s danger-full-access)
              fi
              CMD+=("$CODEX_PROMPT")
              [[ "$MODEL" != "default" ]] && CMD+=(--model "$MODEL")
              [[ "$EFFORT" != "default" ]] && CMD+=(-c "model_reasoning_effort=\"$EFFORT\"")
          boundary and relies on the Bash command-prefix allowlist alone; the run
          header says so loudly. Either way Bash is never blanket-allowed: a command
          prefix outside the list in `run-eval` is auto-denied and the audit stalls
          visibly in the transcript. `CASED_EVAL_ISOLATION` sets the default. The
        evidence_lang: bash
        evidence_markers:
          - lines: "5-6"
            type: mark
            label: "claimed for both platforms under sandbox"
          - lines: "8-9"
            type: del
            label: "under none, the allowlist is described as the only remaining gate"
          - lines: "18"
            type: del
            label: "codex + none: danger-full-access, and ALLOWED_TOOLS is never passed"
          - lines: "23-24"
            type: mark
            label: "README repeats the platform-agnostic claim"
        mechanism: |
          The trust statement at the top of `run-eval` — the text an operator is told to read before pointing the runner at anything — defines `--isolation` in platform-neutral terms: under `sandbox` "tool calls are still limited to ALLOWED_TOOLS", and under `none` the session is "gated only by the ALLOWED_TOOLS command-prefix allowlist". `ALLOWED_TOOLS` is only ever consumed by the `claude)` branch (`--allowedTools`, line 216). The `codex)` branch passes no tool restriction at all, so `--platform codex --isolation none` runs `codex exec -s danger-full-access` with nothing between the session and the operator's account, while the flag's documentation (and evals/README.md's "either way Bash is never blanket-allowed") says a gate is in place. The flag's two values therefore mean different things per platform — on claude, `none` is "OS wall off, allowlist on"; on codex it is "everything off" — and the contract does not say so. This was introduced by the fix commit itself: c8eff06 added both the trust statement and the codex `danger-full-access` mapping. The security surface's eval-bash-allowlist-admits-shell-prefixes goes one step further: the allowlist bounds nothing even on claude.
        remediation: |
          Make the contract match the platforms. State in the `--isolation` header and evals/README.md that the command-prefix allowlist is a claude-platform control and that `--platform codex --isolation none` has no command gate at all; print that in the run header (`isolation: NONE (codex: no command allowlist either)`). If that combination should not exist, reject it in the `codex)` branch the way an unknown platform is rejected. Either way, `just eval --platform codex` should not read a promise the codex path cannot keep.
