          [[ -n "$STRAYS" ]] && STRAY_COUNT="$(echo "$STRAYS" | wc -l | tr -d ' ')"
        evidence_lang: bash
        evidence_markers:
          - lines: "5"
            type: del
            label: "|| true absorbs a git failure as readily as grep's no-match"
        mechanism: |
          Unchanged since the prior audit apart from line numbers. The `|| true` is needed
          because the final grep exits 1 in the good case (no strays matched), but under
          `set -o pipefail` it also absorbs a failure of any earlier stage. If `git status`
          fails — the workdir's .git rewritten by a fixture setup.sh, the session ran `git
          init` somewhere unexpected, git missing — STRAYS is empty, STRAY_COUNT is 0, and
          the run records `stray_file_count: 0` in run-meta.yaml: the same output as a
          perfectly clean run. Workspace hygiene is scored as a contract violation per the
          subagent output contract, so the measurement silently reports the best possible
          result whenever its own instrumentation breaks, and run-meta.yaml carries no field
          distinguishing "measured zero" from "could not measure". The sandbox work since
          the prior audit makes the git-failure branch slightly more likely, not less: a
          session confined by the sandbox can still leave the workdir's index in a state
          `git status` refuses (a lock file from an interrupted git command inside the wall).
        remediation: |
          Capture git's status separately from grep's: `PORCELAIN="$(git -C "$WORKDIR"
          status --porcelain -uall)" || { echo "error: git status failed in $WORKDIR" >&2;
          exit 1; }`, then filter `$PORCELAIN` through the two greps with `|| true` applied
          only to that filtering stage. Alternatively record `stray_file_count: unknown` in
          run-meta.yaml when the git call fails, so the scorer can refuse to credit the run.
