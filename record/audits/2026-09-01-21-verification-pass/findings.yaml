              // treated as `build` for backward compatibility.
              const rawArgs = process.argv.slice(2);
              const SUBCOMMANDS = ['build', 'validate', 'evidence', 'ledger', 'finalize'];
              const positional = rawArgs.filter(a => !a.startsWith('--'));
              let subcommand = 'build';
              let auditDir = positional[0];
              if (SUBCOMMANDS.includes(positional[0])) {
                subcommand = positional[0];
                auditDir = positional[1];
              }
              if (subcommand === 'ledger') {
                const ledgerPath = join(auditDir, 'actions-taken.md');
                if (!existsSync(ledgerPath)) {
                  console.error(`error: ${ledgerPath} does not exist`);
                  process.exit(1);
                }
                const findingsPath = join(auditDir, 'findings.yaml');
                if (!existsSync(findingsPath)) {
                  console.error(`error: ${findingsPath} not found`);
                  process.exit(2);
                }
        evidence_lang: javascript
        evidence_markers:
          - lines: "10"
            type: mark
            label: "an unrecognised subcommand silently becomes the audit directory"
          - lines: "7"
            type: mark
            label: "unknown --flags are dropped with no diagnostic"
          - lines: "17"
            type: del
            label: "exit 1 for a missing ledger…"
          - lines: "22"
            type: del
            label: "…exit 2 for a missing findings.yaml, five lines later"
        mechanism: |
          Partially addressed, still open. The prior finding's second half — `build` validating nothing — was fixed by 44b419c: `assembleReport` now runs the schema validators first, so `build-report.js validte record/audits/x` fails with `refusing to render: … file not found: validte/recon.yaml` instead of an uncaught ENOENT. The first half is unchanged: the parser still cannot reject a subcommand, so the typo is reinterpreted as an audit directory and the error names a path the user never typed as a directory; unknown `--flags` are still filtered away silently (line 1050); and the exit codes are still ad hoc in the same region — within `ledger` a missing actions-taken.md exits 1 while a missing findings.yaml exits 2 (lines 1113/1118), `validate` exits 2 for an unlocatable schema dir but 1 for violations, and the usage block (lines 1059–1065) documents no exit-code contract, unlike `src/recon/recon` (0/1/2/3/4) and `score-eval.mjs` (0/2). Eleven of the twelve fixes since 2365a3f rebuilt this bundle; none touched the entry block.
        remediation: |
          Reject an unrecognised first positional that looks like a subcommand (no path separator and not an existing directory) with the usage text and a non-zero exit; keep the bare-directory form only when the argument resolves to a directory. Error on unknown `--flags` rather than filtering them away, document the exit-code contract in the usage block the way `src/recon/recon` does — 1 usage, 2 missing inputs, 1 gate failures — and make the `ledger` missing-file case use 2.
        temporal:
