audit_date: 2026-08-01
scope: "Full repo — error handling across the config, store, render, and CLI modules"
commit: "a1b2c3d"
assessment: |
  reaudit-rs is a small config-file inspector: a library that parses `key = value`
  documents, persists a snapshot beside the source file, and renders a table, plus
  a thin binary over it. The architecture is sound and the module boundaries are
  honest, but error handling is inconsistent at exactly the places where the
  program meets the outside world. Two paths panic on input a user can supply, two
  discard I/O failures at the snapshot boundary, and the binary's exit status does
  not reflect what the config asked for. None of this is deep; all of it is
  reachable from a first run with an ordinary file.

narratives:
  - slug: input-boundary-panics
    title: "Panics at the Input Boundary"
    thesis: "Both entry points into user data — the config document and the argument vector — reach for values they have not established are there."
    verdict: "The parser is otherwise careful (it trims, skips comments, and skips blank lines), which makes the two unwraps look like oversights rather than policy. Fixing them is local: neither call site has a caller depending on the panic."

    findings:
      - slug: split-unwrap-user-input
        title: "split_once().unwrap() panics on a config line without '='"
        concern: significant
        effort: trivial
        failure_mode: user-visible
        origin:
          kind: pre-existing
        locations:
          - path: src/config.rs
            start_line: 26
            end_line: 26
        evidence: |2
                  let (key, value) = line.split_once('=').unwrap();
        mechanism: |
          `parse` skips blank and comment lines, then assumes every remaining line
          contains an `=`. A config with a stray word — a heading, a typo, a
          half-written key — panics the process with a message that names neither
          the file nor the line. The same document parsed through
          `parse_override` returns a typed error, so the library already knows how
          to say "this line is malformed"; `parse` just does not use it.
        remediation: |
          Skip malformed lines or return `ConfigError::Parse`. If skipping, keep it
          visible — a silent skip trades a panic for lost configuration.

      - slug: args-index-panic
        title: "args[1] panics with no usage message when invoked without arguments"
        concern: moderate
        effort: trivial
        failure_mode: user-visible
        origin:
          kind: pre-existing
        locations:
          - path: src/main.rs
            start_line: 8
            end_line: 8
        evidence: |2
              let path = &args[1];
        mechanism: |
          Running the binary with no arguments — the first thing a new user does —
          panics with `index out of bounds`. There is no usage string anywhere in
          the crate, so the panic is also the only documentation of the calling
          convention.
        remediation: |
          Match on `args.get(1)`, print a one-line usage message, and exit 2.

  - slug: snapshot-io-errors
    title: "The Snapshot Boundary Swallows I/O Failures"
    thesis: "Writing and reading the snapshot both treat an I/O error as an ordinary outcome, so a failed save and a missing file are indistinguishable from success and absence."
    verdict: "This is the surface where the program is least honest. Neither discard changes the happy path, which is why they have survived; both make a real failure look like normal operation."

    findings:
      - slug: silent-write-discard
        title: "let _ = fs::write() loses the snapshot on any I/O failure"
        concern: significant
        effort: trivial
        failure_mode: user-visible
        origin:
          kind: pre-existing
        locations:
          - path: src/store.rs
            start_line: 13
            end_line: 13
        evidence: |2
              let _ = fs::write(path, data);
        mechanism: |
          A read-only directory, a full disk, or a path the process cannot create
          produces exactly the same output as a successful run. The next load
          silently returns the previous snapshot — or none — and the user has no
          way to learn that persistence stopped working.
        remediation: |
          Return `io::Result<()>` and propagate; `merge_config` already returns a
          `Result` and can carry it to the caller.

      - slug: swallowed-load-error
        title: "An unreadable snapshot is indistinguishable from no snapshot"
        concern: moderate
        effort: trivial
        failure_mode: user-visible
        origin:
          kind: pre-existing
        locations:
          - path: src/store.rs
            start_line: 18
            end_line: 22
        evidence: |
          pub fn load_snapshot(path: &Path) -> Snapshot {
              match fs::read_to_string(path) {
                  Ok(raw) => Snapshot::Loaded(crate::config::parse(&raw)),
                  // unreadable snapshots are treated as "no snapshot yet"
                  Err(_) => Snapshot::Missing,
        mechanism: |
          `Snapshot` already has an `Unreadable` variant — the type can express
          the distinction — but the loader collapses every error into `Missing`.
          A permission error or a truncated file therefore reports "no snapshot
          yet", and the next save overwrites whatever was there.
        remediation: |
          Match on `e.kind()`: `NotFound` is `Missing`, everything else is
          `Unreadable(e)`. The render path already handles that variant.

  - slug: process-and-api-contract
    title: "What the Program Promises Its Callers"
    thesis: "The exit status, the rendering width, and the library's error type each promise something the code does not deliver."
    verdict: "Lower urgency than the panics and the discards, but the exit code matters to anything that scripts this binary: a config asking for a non-zero status gets zero."

    findings:
      - slug: exit-code-not-propagated
        title: "The config's exit_code is parsed and then ignored"
        concern: advisory
        effort: trivial
        failure_mode: user-visible
        origin:
          kind: pre-existing
        locations:
          - path: src/main.rs
            start_line: 18
            end_line: 18
        evidence: |2
              println!("{}", render::render(&cfg, &snapshot, cli.verbose));
        mechanism: |
          `Config::exit_code` is read out of the document and never used; `main`
          falls off the end and returns 0. A caller that scripts this binary and
          checks `$?` cannot distinguish the states the config is asking it to
          distinguish. `lib::exit_code_for` already exists to clamp a config value
          into the range a process can return, and nothing calls it.
        remediation: |
          End `main` with `std::process::exit(exit_code_for(cfg.exit_code))`.

      - slug: render-unbounded-width
        title: "key_width is unbounded, so one long key can blow out the table"
        concern: moderate
        effort: small
        failure_mode: user-visible
        origin:
          kind: pre-existing
        locations:
          - path: src/render.rs
            start_line: 5
            end_line: 9
        evidence: |
          /// Width of the widest key, used to align the table. `entries` is the
          /// caller's own parsed map, so the width is bounded by the config file
          /// the caller chose to load.
          fn key_width(entries: &BTreeMap<String, u64>) -> usize {
              entries.keys().map(|k| k.len()).max().unwrap_or(0)
        mechanism: |
          The padding width comes straight from the longest key in the map with no
          ceiling, so a config containing one very long key pads every other row to
          match and the table stops being readable in a terminal.
        remediation: |
          Clamp the computed width to a sane maximum (say 40 columns) and elide
          longer keys.

      - slug: merge-config-takes-string
        title: "merge_config returns Result<_, String>"
        concern: note
        effort: small
        failure_mode: internal
        origin:
          kind: pre-existing
        locations:
          - path: src/lib.rs
            start_line: 11
            end_line: 11
        evidence: |
          pub fn merge_config(path: &Path, overrides: &[String]) -> Result<BTreeMap<String, u64>, String> {
        mechanism: |
          The one public entry point flattens every failure — I/O, parse, override
          — into a `String`, so a caller cannot match on the kind of failure or
          reach the source error. `ConfigError` exists and implements
          `std::error::Error`; the public API just does not use it. Worth noting
          too that `path: &Path` could be `impl AsRef<Path>` for ergonomics.
        remediation: |
          Introduce a `MergeError` enum wrapping `io::Error` and `ConfigError`,
          and return that. Pre-1.0, this is a free change.

summary:
  counts:
    critical: 0
    significant: 2
    moderate: 3
    advisory: 1
    note: 1
